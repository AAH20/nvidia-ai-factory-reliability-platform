[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nvidia-ai-factory-reliability-platform"
version = "0.1.0"
description = "Topology-aware NVIDIA AI factory reliability and capacity reference platform"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
ai-factory-reliability = "ai_factory_reliability.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
